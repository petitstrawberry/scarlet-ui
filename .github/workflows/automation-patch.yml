name: Apply SWS event liveness fix

on:
  push:
    branches:
      - automation/fix-sws-event-liveness-20260808
    paths:
      - .github/workflows/automation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/fix-sws-event-liveness-20260808
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}\n--- old ---\n{old}")
              target.write_text(text.replace(old, new, 1))

          application = "crates/scarlet-ui-core/src/application.rs"
          replace_once(
              application,
              '''use crate::view::View;

#[cfg(feature = "std")]''',
              '''use crate::view::View;

const MAX_EVENTS_PER_WINDOW_PER_TICK: usize = 64;

#[cfg(feature = "std")]''',
          )
          replace_once(
              application,
              '''                while let Some(event) = slot.window.poll_event() {
                    any_event = true;''',
              '''                for _ in 0..MAX_EVENTS_PER_WINDOW_PER_TICK {
                    let Some(event) = slot.window.poll_event() else {
                        break;
                    };
                    any_event = true;''',
          )
          replace_once(
              application,
              '''                sync_text_input(slot.window.as_mut(), &slot.pipeline);
                if present_pipeline(&mut slot.pipeline, slot.window.as_mut())? {
                    slot.presented_this_cycle = true;
                }''',
              '''                sync_text_input(slot.window.as_mut(), &slot.pipeline);''',
          )
          replace_once(
              application,
              '''            if resize_to.is_some() || slot.pipeline.has_dirty() {
                if present_pipeline(&mut slot.pipeline, slot.window.as_mut())? {
                    slot.presented_this_cycle = true;
                }
            }
''',
              '''''',
          )
          replace_once(
              application,
              '''fn sync_after_event<A: Application>(slot: &mut WindowSlot<A>) -> Result<()> {
    sync_text_input(slot.window.as_mut(), &slot.pipeline);
    if slot.pipeline.has_dirty() && present_pipeline(&mut slot.pipeline, slot.window.as_mut())? {
        slot.presented_this_cycle = true;
    }
    Ok(())
}''',
              '''fn sync_after_event<A: Application>(slot: &mut WindowSlot<A>) -> Result<()> {
    sync_text_input(slot.window.as_mut(), &slot.pipeline);
    Ok(())
}''',
          )

          sws = "crates/scarlet-ui-platform-sws/src/lib.rs"
          replace_once(
              sws,
              '''    pending_wheel: PendingWheelDelta,
    needs_full_present: bool,
}''',
              '''    pending_wheel: PendingWheelDelta,
    needs_full_present: bool,
    transport_failed: bool,
    quit_queued: bool,
}''',
          )
          replace_once(
              sws,
              '''            pending_wheel: PendingWheelDelta::default(),
            needs_full_present: false,
        })''',
              '''            pending_wheel: PendingWheelDelta::default(),
            needs_full_present: false,
            transport_failed: false,
            quit_queued: false,
        })''',
          )
          replace_once(
              sws,
              '''        self.pending_events.push(event);
    }

    pub fn sync_text_input''',
              '''        self.pending_events.push(event);
    }

    fn queue_quit(&mut self) {
        if !self.quit_queued {
            self.quit_queued = true;
            self.push_event(Event::Quit);
        }
    }

    fn mark_transport_failed(&mut self) {
        if !self.transport_failed {
            self.transport_failed = true;
            logln!(
                "[SWSPlatformWindow] transport failed for surface {}",
                self.surface_id
            );
            self.queue_quit();
        }
    }

    pub fn sync_text_input''',
          )
          replace_once(
              sws,
              '''        let _ = self.conn.dispatch().ok();

        while let Some(ev) = self.event_receiver.poll_event() {
            self.handle_sws_event(ev);
        }
''',
              '''        if !self.transport_failed && self.conn.dispatch().is_err() {
            self.mark_transport_failed();
        }

        if !self.transport_failed {
            while let Some(ev) = self.event_receiver.poll_event() {
                self.handle_sws_event(ev);
            }
        }
''',
          )
          replace_once(
              sws,
              '''        // Get the surface and copy pixels
        let _ = self.conn.with_surface_mut(self.surface_id, |surface| {
            // Get the shared memory buffer
            surface.with_buffer(|shm_buf, width, height| {
                let full_damage = [(0, 0, width, height)];
                let regions = damage.unwrap_or(&full_damage);
                for region in regions {
                    let _ = Self::copy_buffer_region(buffer, shm_buf, width, height, *region);
                }
            });
        });

        match damage {
            Some(rects) => {
                for rect in rects {
                    let (x, y, width, height) = *rect;
                    if width > 0 && height > 0 {
                        let _ = self
                            .conn
                            .commit_region(self.surface_id, x, y, width, height);
                    }
                }
            }
            None => {
                let _ = self.conn.commit(self.surface_id);
            }
        };

        self.needs_full_present = false;''',
              '''        if self.transport_failed {
            return;
        }

        // Get the surface and copy pixels
        let copied = self.conn.with_surface_mut(self.surface_id, |surface| {
            // Get the shared memory buffer
            surface.with_buffer(|shm_buf, width, height| {
                let full_damage = [(0, 0, width, height)];
                let regions = damage.unwrap_or(&full_damage);
                for region in regions {
                    let _ = Self::copy_buffer_region(buffer, shm_buf, width, height, *region);
                }
            });
        });
        if copied.is_none() {
            self.queue_quit();
            return;
        }

        let committed = match damage {
            Some(rects) => {
                let mut committed = true;
                for rect in rects {
                    let (x, y, width, height) = *rect;
                    if width > 0
                        && height > 0
                        && self
                            .conn
                            .commit_region(self.surface_id, x, y, width, height)
                            .is_err()
                    {
                        committed = false;
                        break;
                    }
                }
                committed
            }
            None => self.conn.commit(self.surface_id).is_ok(),
        };

        if committed {
            self.needs_full_present = false;
        } else {
            self.mark_transport_failed();
        }''',
          )
          replace_once(
              sws,
              '''                    self.push_event(Event::Quit);''',
              '''                    self.queue_quit();''',
          )
          PY

      - name: Format
        run: cargo fmt --all

      - name: Test
        run: cargo test --verbose

      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/automation-patch.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: bound SWS event processing and fail closed"
          git push origin HEAD:automation/fix-sws-event-liveness-20260808
