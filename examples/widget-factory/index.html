<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScarletUI Widget Factory / WebGPU</title>
<style>html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#fff } canvas { display:block; width:100%; height:100%; border:0; outline:none; touch-action:none } #error { position:absolute; top:0; color:#900; white-space:pre-wrap }</style>
<canvas id="ui" aria-label="ScarletUI Widget Factory / WebGPU"></canvas><pre id="error"></pre>
<script type="module">
import init, { start, runtime_error } from './pkg/scarlet_ui_widget_factory.js';
const error = document.querySelector('#error');
try {
  await init();
  await start();
  const check = setInterval(() => {
    const message = runtime_error();
    if (message) { error.textContent = message; clearInterval(check); }
  }, 250);
} catch (e) {
  error.textContent = `ScarletUI could not start: ${e}
A WebGPU adapter and a secure context (HTTPS or localhost) are required.`;
  console.error(e);
}
</script>
