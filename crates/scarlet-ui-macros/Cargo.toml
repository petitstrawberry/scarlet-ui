[package]
name = "scarlet-ui-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[features]
# Match the consuming crate's cfg when testing preview registration examples.
preview = []

[dependencies]
proc-macro2 = { version = "1.0", default-features = false }
quote = { version = "1.0", default-features = false }
syn = { version = "2.0", default-features = false, features = ["derive", "full", "parsing", "printing", "proc-macro"] }

[dev-dependencies]
scarlet-ui = { path = "../scarlet-ui", features = ["preview"] }
