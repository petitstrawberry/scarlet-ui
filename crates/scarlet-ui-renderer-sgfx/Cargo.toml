[package]
name = "scarlet-ui-renderer-sgfx"
version = "1.0.0"
edition = "2024"

[features]
default = ["std"]
legacy-scarlet-std = [
    "scarlet-ui-core/legacy-scarlet-std",
]
std = [
    "scarlet-ui-core/std",
    "sgfx/std",
]

[dependencies]
libm = { version = "0.2", default-features = false }
scarlet-ui-core = { path = "../scarlet-ui-core", default-features = false }
sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "a18b5a585616f05cf5df0fa5be1977752ceca1ea", package = "sgfx-core", default-features = false }

[lib]
name = "scarlet_ui_renderer_sgfx"
path = "src/lib.rs"
