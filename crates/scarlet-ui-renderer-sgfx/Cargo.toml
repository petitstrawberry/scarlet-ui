[package]
name = "scarlet-ui-renderer-sgfx"
version = "1.0.0"
edition = "2024"

[features]
default = ["std"]
legacy-scarlet-std = [
    "scarlet-ui-core/legacy-scarlet-std",
]
std = [
    "scarlet-ui-core/std",
    "sgfx/std",
]

[dependencies]
libm = { version = "0.2", default-features = false }
scarlet-ui-core = { path = "../scarlet-ui-core", default-features = false }
sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "77e64a81115d78fab7c63671c2a6c16aac060c05", package = "sgfx-core", default-features = false }

[lib]
name = "scarlet_ui_renderer_sgfx"
path = "src/lib.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sgfx-backend-wgpu = { git = "https://github.com/petitstrawberry/sgfx", rev = "22e3d283046543239d2f3606dea73d9fcac7abad" }
wgpu = "24"
pollster = "0.4"
