[package]
name = "scarlet-ui-renderer-sgfx"
version = "1.0.0"
edition = "2024"

[features]
default = ["std"]
legacy-scarlet-std = [
    "scarlet-ui-core/legacy-scarlet-std",
]
std = [
    "scarlet-ui-core/std",
    "sgfx/std",
]

[dependencies]
libm = { version = "0.2", default-features = false }
scarlet-ui-core = { path = "../scarlet-ui-core", default-features = false }
sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "3a6a987aaa5284056d4b1dcb0cd45326d30b3fe1", package = "sgfx-core", default-features = false }

[lib]
name = "scarlet_ui_renderer_sgfx"
path = "src/lib.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sgfx-backend-wgpu = { git = "https://github.com/petitstrawberry/sgfx", rev = "fbfbefd6fd8593f9557d058574918b0016919f81" }
wgpu = "24"
pollster = "0.4"
