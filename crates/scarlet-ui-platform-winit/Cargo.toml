[package]
name = "scarlet-ui-platform-winit"
version = "0.1.0"
edition = "2024"

[features]
default = ["std", "sgfx"]
std = ["scarlet-ui-core/std"]
sgfx = ["dep:raw-window-handle", "dep:sgfx"]
# Compatibility alias for callers that enabled the former concrete backend.
wgpu = ["sgfx"]

[dependencies]
scarlet-ui-core = { path = "../scarlet-ui-core", default-features = false, features = ["std"] }
scarlet-ui-renderer-sgfx = { path = "../scarlet-ui-renderer-sgfx", default-features = false, features = ["std"] }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
softbuffer = "0.4.8"
winit = "0.30.13"
raw-window-handle = { version = "0.6", optional = true }
sgfx = { git = "https://github.com/petitstrawberry/Scarlet", branch = "dev", package = "sgfx", default-features = false, features = ["std", "backend-wgpu"], optional = true }

[lib]
name = "scarlet_ui_platform_winit"
path = "src/lib.rs"
