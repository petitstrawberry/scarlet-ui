[package]
name = "scarlet-ui-platform-winit"
version = "1.0.0"
edition = "2024"

[features]
default = ["std", "sgfx"]
std = ["scarlet-ui-core/std"]
sgfx = ["dep:raw-window-handle", "dep:sgfx"]

[dependencies]
scarlet-ui-core = { path = "../scarlet-ui-core", default-features = false, features = ["std"] }
scarlet-ui-renderer-sgfx = { path = "../scarlet-ui-renderer-sgfx", default-features = false, features = ["std"] }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
softbuffer = "0.4.8"
winit = "0.30.13"
raw-window-handle = { version = "0.6", optional = true }
sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "8f2f7cd626c6f391516d2c5c5510b71db5cf4bf7", package = "sgfx", default-features = false, features = ["std", "backend-wgpu"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSView", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.2.2", default-features = false, features = ["CALayer"] }

[lib]
name = "scarlet_ui_platform_winit"
path = "src/lib.rs"
