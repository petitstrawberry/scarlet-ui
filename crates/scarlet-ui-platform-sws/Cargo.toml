[package]
name = "scarlet-ui-platform-sws"
version = "1.0.0"
edition = "2024"

[features]
default = ["std"]
legacy-scarlet-std = [
    "scarlet-ui-core/legacy-scarlet-std",
    "scarlet-ui-renderer-sgfx/legacy-scarlet-std",
    "dep:scarlet-std",
    "sgfx/legacy-scarlet-std",
    "sws-client/legacy-scarlet-std",
    "sws-protocol/legacy-scarlet-std",
    "sbus-client/legacy-scarlet-std",
    "scarlet-desktop-config/legacy-scarlet-std",
]
std = [
    "scarlet-ui-core/std",
    "scarlet-ui-renderer-sgfx/std",
    "sgfx/std",
    "sws-client/std",
    "sws-protocol/std",
    "sbus-client/std",
    "scarlet-desktop-config/std",
]

[dependencies]
scarlet-ui-core = { path = "../scarlet-ui-core", default-features = false }
scarlet-ui-renderer-sgfx = { path = "../scarlet-ui-renderer-sgfx", default-features = false }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", rev = "74b92fe8c43ba71467dd70083411c4574de01079", package = "scarlet-std", optional = true }
sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "bfd51791aada00ecd93d797c5646e78b5511288f", package = "sgfx", default-features = false, features = ["backend-dynamic", "backend-scarlet-virgl", "backend-scarlet-adreno"] }
sws-client = { git = "https://github.com/petitstrawberry/Scarlet", rev = "74b92fe8c43ba71467dd70083411c4574de01079", package = "sws-client", default-features = false }
sws-protocol = { git = "https://github.com/petitstrawberry/Scarlet", rev = "74b92fe8c43ba71467dd70083411c4574de01079", package = "sws-protocol", default-features = false }

sbus-client = { git = "https://github.com/petitstrawberry/Scarlet", rev = "74b92fe8c43ba71467dd70083411c4574de01079", default-features = false }
scarlet-desktop-config = { git = "https://github.com/petitstrawberry/Scarlet", rev = "74b92fe8c43ba71467dd70083411c4574de01079", default-features = false }

[lib]
name = "scarlet_ui_platform_sws"
path = "src/lib.rs"
