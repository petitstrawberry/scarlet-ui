[package]
name = "scarlet-ui-platform-sws"
version = "1.0.0"
edition = "2024"

[features]
default = ["std"]
legacy-scarlet-std = [
    "scarlet-ui-core/legacy-scarlet-std",
    "scarlet-ui-renderer-sgfx/legacy-scarlet-std",
    "dep:scarlet-std",
    "sgfx/legacy-scarlet-std",
    "sws-client/legacy-scarlet-std",
    "sws-protocol/legacy-scarlet-std",
    "sbus-client/legacy-scarlet-std",
    "scarlet-desktop-config/legacy-scarlet-std",
]
std = [
    "scarlet-ui-core/std",
    "scarlet-ui-renderer-sgfx/std",
    "sgfx/std",
    "sws-client/std",
    "sws-protocol/std",
    "sbus-client/std",
    "scarlet-desktop-config/std",
]

[dependencies]
scarlet-ui-core = { path = "../scarlet-ui-core", default-features = false }
scarlet-ui-renderer-sgfx = { path = "../scarlet-ui-renderer-sgfx", default-features = false }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", rev = "153ba86112ace49becf3d38a2ae34692b2149cb0", package = "scarlet-std", optional = true }
sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "3ae35ccdcef154560f0dc384044f2d9b268f2dba", package = "sgfx", default-features = false, features = ["backend-dynamic", "backend-scarlet-virgl", "backend-scarlet-adreno"] }
sws-client = { git = "https://github.com/petitstrawberry/Scarlet", rev = "153ba86112ace49becf3d38a2ae34692b2149cb0", package = "sws-client", default-features = false }
sws-protocol = { git = "https://github.com/petitstrawberry/Scarlet", rev = "153ba86112ace49becf3d38a2ae34692b2149cb0", package = "sws-protocol", default-features = false }

sbus-client = { git = "https://github.com/petitstrawberry/Scarlet", rev = "153ba86112ace49becf3d38a2ae34692b2149cb0", default-features = false }
scarlet-desktop-config = { git = "https://github.com/petitstrawberry/Scarlet", rev = "153ba86112ace49becf3d38a2ae34692b2149cb0", default-features = false }

[lib]
name = "scarlet_ui_platform_sws"
path = "src/lib.rs"
