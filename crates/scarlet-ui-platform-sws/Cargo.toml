[package]
name = "scarlet-ui-platform-sws"
version = "1.0.0"
edition = "2024"

[features]
default = ["std"]
legacy-scarlet-std = [
    "scarlet-ui-core/legacy-scarlet-std",
    "scarlet-ui-renderer-sgfx/legacy-scarlet-std",
    "dep:scarlet-std",
    "sgfx/legacy-scarlet-std",
    "sws-client/legacy-scarlet-std",
    "sws-protocol/legacy-scarlet-std",
    "sbus-client/legacy-scarlet-std",
    "scarlet-desktop-config/legacy-scarlet-std",
]
std = [
    "scarlet-ui-core/std",
    "scarlet-ui-renderer-sgfx/std",
    "sgfx/std",
    "sws-client/std",
    "sws-protocol/std",
    "sbus-client/std",
    "scarlet-desktop-config/std",
]

[dependencies]
scarlet-ui-core = { path = "../scarlet-ui-core", default-features = false }
scarlet-ui-renderer-sgfx = { path = "../scarlet-ui-renderer-sgfx", default-features = false }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", rev = "15331d9a3577bd08228a4464d9e2f3a6e9daa78d", package = "scarlet-std", optional = true }
sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "fbfbefd6fd8593f9557d058574918b0016919f81", package = "sgfx", default-features = false, features = ["backend-dynamic"] }
sws-client = { git = "https://github.com/petitstrawberry/Scarlet", rev = "15331d9a3577bd08228a4464d9e2f3a6e9daa78d", package = "sws-client", default-features = false }
sws-protocol = { git = "https://github.com/petitstrawberry/Scarlet", rev = "15331d9a3577bd08228a4464d9e2f3a6e9daa78d", package = "sws-protocol", default-features = false }

sbus-client = { git = "https://github.com/petitstrawberry/Scarlet", rev = "15331d9a3577bd08228a4464d9e2f3a6e9daa78d", default-features = false }
scarlet-desktop-config = { git = "https://github.com/petitstrawberry/Scarlet", rev = "15331d9a3577bd08228a4464d9e2f3a6e9daa78d", default-features = false }

[lib]
name = "scarlet_ui_platform_sws"
path = "src/lib.rs"
